<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rotating Planets Orbit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: black;
        font-family: "Orbitron", sans-serif;
        color: white;
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 0;
      }

      .planet {
        animation: spin 10s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      #sun {
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 10px yellow;
        }
        50% {
          box-shadow: 0 0 20px orange;
        }
        100% {
          box-shadow: 0 0 10px yellow;
        }
      }

      .heading {
        position: fixed;
        top: 20px;
        width: 100%;
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        color: #ffffff;
        text-shadow: 0 0 10px #00f0ff;
        z-index: 10000;
      }

      .solar-system {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1000px;
        height: 1000px;
        transform: translate(-50%, -50%);
        z-index: 2;
      }

      .sun {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 40px;
        height: 40px;
        background: radial-gradient(circle, #ffd700, #ff8c00);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 40px #ff9900;
        z-index: 3;
      }

      .planet {
        position: absolute;
        border-radius: 50%;
        animation: glow 2s infinite alternate;
        z-index: 4;
      }

      @keyframes glow {
        0% {
          box-shadow: 0 0 4px rgba(255, 255, 255, 0.3);
        }
        100% {
          box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
        }
      }

      .label {
        position: absolute;
        font-size: 12px;
        white-space: nowrap;
        text-shadow: 0 0 3px #000;
        z-index: 5;
      }

      .orbit-ring {
        position: absolute;
        border: 1px solid rgba(255, 255, 255, 0.6); /* Increased visibility */
        border-radius: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.4); /* Brighter shadow */
      }

      .back-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(255, 255, 255, 0.1);
        color: white;
        border: 1px solid white;
        padding: 10px 20px;
        border-radius: 25px;
        text-decoration: none;
        font-weight: bold;
        z-index: 9999;
        transition: background 0.3s;
      }

      .back-button:hover {
        background-color: rgba(255, 255, 255, 0.3);
      }

      .slider-container {
        position: fixed;
        bottom: 80px;
        width: 100%;
        text-align: center;
        z-index: 9999;
        font-size: 14px;
      }

      #timeSlider {
        width: 300px;
      }
    </style>
  </head>
  <body>
    <canvas id="spaceCanvas"></canvas>

    <div class="solar-system" id="solarSystem">
      <div class="sun"></div>
    </div>

    <div class="heading">Planetary Orbit Visualizer</div>

    <div class="slider-container">
      <label for="timeSlider">Simulation Speed:</label>
      <input
        type="range"
        id="timeSlider"
        min="0.1"
        max="5"
        value="1"
        step="0.1"
      />
    </div>

    <a href="index.html" class="back-button">← Back to Dashboard</a>

    <script>
      const canvas = document.getElementById("spaceCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const stars = [];
      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }
      for (let i = 0; i < 100; i++) {
        stars.push({
          x: rand(0, canvas.width),
          y: rand(0, canvas.height),
          r: rand(0.3, 1.3),
          vx: rand(-0.1, 0.1),
          vy: rand(-0.1, 0.1),
        });
      }

      function drawStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = "#ffffff";
          ctx.fill();
          s.x += s.vx;
          s.y += s.vy;
          if (s.x < 0 || s.x > canvas.width) s.vx *= -1;
          if (s.y < 0 || s.y > canvas.height) s.vy *= -1;
        }
        requestAnimationFrame(drawStars);
      }
      drawStars();

      window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });

      const solarSystem = document.getElementById("solarSystem");
      const centerX = 500;
      const centerY = 500;

      const planets = [
        {
          name: "Mercury",
          color: "#aaa",
          radius: 80,
          speed: 0.03,
          size: 5,
          distance: "0.39 AU",
          info: "Diameter: 4,879 km\nYear: 88 days",
        },
        {
          name: "Venus",
          color: "#eccc9a",
          radius: 120,
          speed: 0.02,
          size: 11,
          distance: "0.72 AU",
          info: "Diameter: 12,104 km\nYear: 225 days",
        },
        {
          name: "Earth",
          color: "#3faaff",
          radius: 160,
          speed: 0.015,
          size: 12,
          distance: "1 AU",
          info: "Diameter: 12,742 km\nYear: 365 days",
        },
        {
          name: "Mars",
          color: "#ff4c4c",
          radius: 200,
          speed: 0.012,
          size: 6,
          distance: "1.52 AU",
          info: "Diameter: 6,779 km\nYear: 687 days",
        },
        {
          name: "Jupiter",
          color: "#d2b48c",
          radius: 250,
          speed: 0.009,
          size: 132,
          distance: "5.2 AU",
          info: "Diameter: 139,820 km\nYear: 12 years",
        },
        {
          name: "Saturn",
          color: "#f4e2d8",
          radius: 300,
          speed: 0.007,
          size: 110,
          distance: "9.5 AU",
          info: "Diameter: 116,460 km\nYear: 29 years",
        },
        {
          name: "Uranus",
          color: "#90e0ef",
          radius: 350,
          speed: 0.005,
          size: 48,
          distance: "19.8 AU",
          info: "Diameter: 50,724 km\nYear: 84 years",
        },
        {
          name: "Neptune",
          color: "#4361ee",
          radius: 400,
          speed: 0.003,
          size: 46,
          distance: "30 AU",
          info: "Diameter: 49,244 km\nYear: 165 years",
        },
      ];

      const infoPopup = document.createElement("div");
      infoPopup.style.position = "fixed";
      infoPopup.style.padding = "10px";
      infoPopup.style.background = "rgba(0,0,0,0.8)";
      infoPopup.style.border = "1px solid white";
      infoPopup.style.color = "white";
      infoPopup.style.fontSize = "12px";
      infoPopup.style.zIndex = 100000;
      infoPopup.style.display = "none";
      infoPopup.style.pointerEvents = "none";
      infoPopup.style.borderRadius = "8px";
      document.body.appendChild(infoPopup);

      planets.forEach((p) => {
        const ring = document.createElement("div");
        ring.className = "orbit-ring";
        ring.style.width = `${p.radius * 2}px`;
        ring.style.height = `${p.radius * 2}px`;
        ring.style.left = `${centerX}px`;
        ring.style.top = `${centerY}px`;
        solarSystem.appendChild(ring);

        p.element = document.createElement("div");
        p.element.className = "planet";
        p.element.style.background = p.color;
        p.element.style.width = `${p.size}px`;
        p.element.style.height = `${p.size}px`;
        p.element.addEventListener("mouseenter", () => {
          infoPopup.innerText = `${p.name}\n${p.info}\nDistance: ${p.distance}`;
          infoPopup.style.display = "block";
        });
        p.element.addEventListener("mouseleave", () => {
          infoPopup.style.display = "none";
        });
        solarSystem.appendChild(p.element);

        p.label = document.createElement("div");
        p.label.className = "label";
        p.label.innerText = p.name;
        solarSystem.appendChild(p.label);

        p.angle = Math.random() * Math.PI * 2;
      });

      document.addEventListener("mousemove", (e) => {
        infoPopup.style.left = `${e.clientX + 15}px`;
        infoPopup.style.top = `${e.clientY + 15}px`;
      });

      const earth = planets.find((p) => p.name === "Earth");
      const moon = {
        name: "Moon",
        radius: 20,
        speed: 0.05,
        color: "#ccc",
        parent: earth,
        angle: Math.random() * Math.PI * 2,
        size: 3,
      };

      moon.element = document.createElement("div");
      moon.element.className = "planet";
      moon.element.style.width = `${moon.size}px`;
      moon.element.style.height = `${moon.size}px`;
      moon.element.style.background = moon.color;
      solarSystem.appendChild(moon.element);

      moon.label = document.createElement("div");
      moon.label.className = "label";
      moon.label.innerText = moon.name;
      solarSystem.appendChild(moon.label);

      // Saturn Multiple Rings Setup
      const saturn = planets.find((p) => p.name === "Saturn");
      const saturnRings = [];

      for (let i = 0; i < 3; i++) {
        const ring = document.createElement("div");
        ring.style.position = "absolute";
        ring.style.border = `1.5px solid rgba(255, 255, 255, ${
          0.15 + i * 0.1
        })`;
        ring.style.borderRadius = "50%";
        ring.style.pointerEvents = "none";
        ring.style.zIndex = 3;
        ring.style.transform = "rotate(25deg)";
        ring.style.width = `${saturn.size * (2.0 + i * 0.3)}px`;
        ring.style.height = `${saturn.size * (0.5 + i * 0.2)}px`;
        solarSystem.appendChild(ring);
        saturnRings.push(ring);
      }

      let timeMultiplier = 1;
      // --- ASTEROID BELT SETUP ---
      const asteroidBelt = [];
      const beltRadiusMin = 220;
      const beltRadiusMax = 240;
      const asteroidCount = 150;

      for (let i = 0; i < asteroidCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius =
          beltRadiusMin + Math.random() * (beltRadiusMax - beltRadiusMin);
        const size = Math.random() * 2 + 1;
        const speed = 0.002 + Math.random() * 0.002;

        const asteroid = {
          angle,
          radius,
          size,
          speed,
          element: document.createElement("div"),
        };

        asteroid.element.style.position = "absolute";
        asteroid.element.style.width = `${asteroid.size}px`;
        asteroid.element.style.height = `${asteroid.size}px`;
        asteroid.element.style.background = "gray";
        asteroid.element.style.borderRadius = "50%";
        asteroid.element.style.zIndex = 2;

        solarSystem.appendChild(asteroid.element);
        asteroidBelt.push(asteroid);
      }

      document.getElementById("timeSlider").addEventListener("input", (e) => {
        timeMultiplier = parseFloat(e.target.value);
      });

      function animatePlanets() {
        planets.forEach((p) => {
          p.angle += p.speed * timeMultiplier;
          const x = centerX + p.radius * Math.cos(p.angle);
          const y = centerY + p.radius * Math.sin(p.angle);

          p.element.style.left = `${x - p.size / 2}px`;
          p.element.style.top = `${y - p.size / 2}px`;
          p.label.style.left = `${x + p.size / 2 + 5}px`;
          p.label.style.top = `${y - 6}px`;

          if (p.name === "Earth") {
            const moonX = x + moon.radius * Math.cos(moon.angle);
            const moonY = y + moon.radius * Math.sin(moon.angle);
            moon.angle += moon.speed * timeMultiplier;
            moon.element.style.left = `${moonX - moon.size / 2}px`;
            moon.element.style.top = `${moonY - moon.size / 2}px`;
            moon.label.style.left = `${moonX + moon.size}px`;
            moon.label.style.top = `${moonY - 4}px`;
          }
          if (p.name === "Saturn") {
            const ringX = centerX + p.radius * Math.cos(p.angle);
            const ringY = centerY + p.radius * Math.sin(p.angle);

            saturnRings.forEach((ring, i) => {
              const w = saturn.size * (2.0 + i * 0.3);
              const h = saturn.size * (0.5 + i * 0.2);
              ring.style.left = `${ringX - w / 2}px`;
              ring.style.top = `${ringY - h / 2}px`;
            });
          }
        });
        // --- Animate asteroid belt ---
        asteroidBelt.forEach((a) => {
          a.angle += a.speed * timeMultiplier;
          const x = centerX + a.radius * Math.cos(a.angle);
          const y = centerY + a.radius * Math.sin(a.angle);
          a.element.style.left = `${x - a.size / 2}px`;
          a.element.style.top = `${y - a.size / 2}px`;
        });

        requestAnimationFrame(animatePlanets);
      }

      animatePlanets();
    </script>
  </body>
</html>
